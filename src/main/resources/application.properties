spring.application.name=airplanes
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}
app.yandex.client-id=${YANDEX_CLIENT_ID}
app.yandex.client-secret=${YANDEX_CLIENT_SECRET}
app.yandex.redirect-uri=${YANDEX_REDIRECT_URI:http://localhost:5173/api/auth/yandex/callback}
app.auth.frontend-success-url=${SUCCESS_URL}
app.auth.frontend-failure-url=${FAILURE_URL}
app.auth.allowed-origins=${ALLOWED_ORIGINS}