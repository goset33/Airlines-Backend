spring.application.name=airplanes
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}
app.yandex.client-id=${YANDEX_CLIENT_ID}
app.yandex.client-secret=${YANDEX_CLIENT_SECRET}
app.yandex.redirect-uri=${YANDEX_REDIRECT_URI:http://localhost:8080/api/auth/yandex/callback}
app.auth.frontend-success-url=http://localhost:8080/api/auth/me
app.auth.frontend-failure-url=http://localhost:8080/actuator/health
app.auth.cookie-same-site=None
app.auth.allowed-origins=http://localhost:8080